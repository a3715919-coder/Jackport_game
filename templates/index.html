<!DOCTYPE html>
<html>

<head>
    <title>Jackpot Game</title>
</head>

<body>

    <h1>🎰 Jackpot Game</h1>

    <p>Guess a number between 1 and 100</p>

    <form method="POST">

        <input
            type="number"
            name="guess"
            placeholder="Enter Number"
            required>

        <button type="submit">
            Check
        </button>

    </form>

    <h2>{{ result }}</h2>

</body>

</html>
